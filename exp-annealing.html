<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Damped Descent and Simulated Annealing on an Energy Surface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f0eadc; --ink-soft:#b8b1a4; --ink-faint:#6f6b64;
  --gold:#ffc65a; --cool:#a9c4ff; --bad:#c9574a;
  --serif:"Libre Caslon Text","Iowan Old Style",Georgia,serif;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
.tl{position:absolute;left:28px;top:22px}
.tl h1{font:400 26px/1.15 var(--serif);margin:0 0 6px;letter-spacing:.01em;max-width:520px;text-wrap:balance}
.tl .sub{font:italic 400 15px/1.35 var(--serif);color:var(--ink-soft);max-width:520px}
.tr{position:absolute;right:28px;top:26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 300px);row-gap:10px}
.dial{display:flex;align-items:center;gap:12px;font:500 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.dial .tv{font:400 22px/1 var(--serif);color:var(--ink);min-width:3.6ch;text-align:right;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.dial input[type=range]{-webkit-appearance:none;appearance:none;width:180px;height:22px;background:transparent;cursor:pointer}
.dial input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--cool),var(--gold) 60%,#ff7a3c)}
.dial input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid #000;margin-top:-7px;box-shadow:0 0 0 1px rgba(236,230,218,.4)}
.dial input[type=range]::-moz-range-track{height:2px;background:linear-gradient(90deg,var(--cool),var(--gold) 60%,#ff7a3c)}
.dial input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid #000}
.tog{font:500 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);background:none;border:1px solid rgba(236,230,218,.14);border-radius:3px;padding:10px 13px;cursor:pointer;transition:all .25s}
.tog.on{color:var(--ink);border-color:rgba(236,230,218,.55);background:rgba(236,230,218,.06)}
.tog:hover{color:var(--ink)}
.seg{display:flex;gap:0}.seg .tog{border-radius:0}.seg .tog:first-child{border-radius:3px 0 0 3px}.seg .tog:last-child{border-radius:0 3px 3px 0;margin-left:-1px}
.br{position:absolute;right:28px;bottom:28px;display:flex;align-items:center;gap:10px}
.btn{font:500 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);background:none;border:1px solid rgba(236,230,218,.14);border-radius:3px;padding:11px 14px;cursor:pointer;transition:all .25s}
.btn:hover{color:var(--ink);border-color:rgba(236,230,218,.5)}
.bl{position:absolute;left:28px;bottom:28px}
#strip{display:block;width:360px;height:116px}
.key{display:flex;gap:18px;margin-top:8px;font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.key i{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-right:8px}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;font:500 12px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 10px rgba(0,0,0,.95)}
.lab b{display:block;font:400 18px/1.2 var(--serif);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.lab small{display:block;font:italic 400 12px/1.4 var(--serif);letter-spacing:0;text-transform:none;color:var(--ink-soft)}
.lab.h{color:var(--cool)}.lab.b{color:var(--gold)}.lab.b2{color:#ff9a5a}
@media (max-width:760px){.tl h1{font-size:24px}.tr{top:18px;right:18px;gap:10px}.tl{left:18px;top:18px}.br{right:18px;bottom:18px}.bl{left:18px;bottom:18px}#strip{width:240px;height:80px}.dial input[type=range]{width:110px}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="hud">
  <div class="tl"><h1>Damped Descent and Simulated Annealing on an Energy Surface</h1><div class="sub" id="sub">A damped ball following −∇E, with and without Metropolis-accepted jumps under a cooling schedule, from one initial condition</div></div>
  <div class="tr">
    <div class="seg"><button class="tog on" data-land="hollows">Hollows</button><button class="tog" data-land="ackley">Ackley</button></div>
    <div class="seg"><button class="tog on" data-view="two">Two rules</button><button class="tog" data-view="copies">Two copies</button><button class="tog" data-view="ensemble">Ensemble</button></div>
    <div class="dial"><span>T</span><input type="range" id="temp" min="0" max="1000" value="812"><span class="tv" id="tval">0.60</span></div>
    <button class="tog on" id="cool">Cool</button>
    <button class="tog on" id="loop">Loop</button>
  </div>
  <div class="bl">
    <canvas id="strip" width="720" height="232"></canvas>
    <div class="key"><span><i style="background:var(--cool)"></i>Hopfield</span><span><i style="background:var(--gold)"></i>Boltzmann</span></div>
  </div>
  <div class="br"><button class="btn" id="again">Drop again</button><button class="btn" id="elsewhere">Drop elsewhere</button></div>
  <div id="labels"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ landscape */
/* A smooth energy over (u,v) ∈ [−1,1]². Six hollows of different depths with
   ridges between them, on a gentle bowl, with a little texture. Checked by
   descent from a 21×21 grid: minima at −1.59 (front right, the deep one),
   −0.59, −0.48, −0.44, −0.27 (the drop hollow, back left) and −0.21. */
function fHollows(u,v){
  const g=(cx,cy,s)=>Math.exp(-((u-cx)*(u-cx)+(v-cy)*(v-cy))/(2*s*s));
  return 0.5*(u*u+0.7*(v-0.1)*(v-0.1))
    -1.65*g(0.25,0.55,0.23)
    -0.60*g(-0.55,-0.62,0.16)
    -0.72*g(0.45,-0.55,0.17)
    -0.80*g(-0.62,0.12,0.18)
    -0.48*g(-0.05,-0.12,0.15)
    -0.42*g(0.76,0.05,0.13)
    +0.22*g(-0.30,-0.36,0.15)+0.20*g(0.20,-0.30,0.15)+0.20*g(-0.30,0.36,0.15)+0.18*g(0.05,0.2,0.14)
    +0.05*Math.sin(6*u)*Math.cos(5*v);
}
/* The Ackley function (David Ackley, 1987, "A Connectionist Machine for Genetic
   Hillclimbing"): an exponential funnel to one minimum at the origin, with a
   cosine ripple that puts a shallow local minimum in every cell. Scaled to this
   page's energy range so both rules run on it unchanged. */
function fAckley(u,v){
  const x=u*3.2,y=v*3.2;
  return (-20*Math.exp(-0.2*Math.sqrt(0.5*(x*x+y*y)))-Math.exp(0.5*(Math.cos(2*Math.PI*x)+Math.cos(2*Math.PI*y)))+Math.E+20)*0.28-1.6;
}
const LANDS={
  hollows:{key:'hollows',f:fHollows,drop:{u:-0.85,v:0.9},sub:'A damped ball following −∇E, with and without Metropolis-accepted jumps under a cooling schedule, from one initial condition'},
  ackley:{key:'ackley',f:fAckley,drop:{u:-0.85,v:0.85},sub:'The same two processes on the Ackley function (1987)'}
};
let LAND=LANDS.hollows;let f=LAND.f;
function grad(u,v){const h=1e-3;return [(f(u+h,v)-f(u-h,v))/(2*h),(f(u,v+h)-f(u,v-h))/(2*h)];}
const SCALE=7.5, YS=2.8, R=0.19;
const ROLL={K:1.1,C:2.4,VMAX:0.9};
const wx=u=>u*SCALE, wz=v=>v*SCALE, wy=(u,v)=>f(u,v)*YS;
const DROP={u:LAND.drop.u,v:LAND.drop.v};
function computeRange(fn){let mn=Infinity,mx=-Infinity;for(let i=0;i<=120;i++)for(let j=0;j<=120;j++){const e=fn(i/60-1,j/60-1);if(e<mn)mn=e;if(e>mx)mx=e;}return [mn,mx];}
let FMIN=0,FMAX=1;

/* ------------------------------------------------------------------ scene */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance',preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);scene.fog=new THREE.FogExp2(0x000000,0.017);
const camera=new THREE.PerspectiveCamera(36,1,0.1,200);
scene.add(new THREE.HemisphereLight(0x6a55a8,0x000000,0.32));
const key=new THREE.DirectionalLight(0xfff0dc,0.85);key.position.set(5,12,7);scene.add(key);
const rim=new THREE.DirectionalLight(0x7a6ad0,0.5);rim.position.set(-7,6,-9);scene.add(rim);

// the ramp: near-white gold at the very bottom, through orange and crimson to a deep violet rim
const RAMP=[[0.00,0xfff3b0],[0.10,0xffc257],[0.26,0xff6f3c],[0.46,0xcf3a6c],[0.68,0x6f2b95],[0.86,0x3a2276],[1.00,0x1c1846]].map(p=>[p[0],new THREE.Color(p[1])]);
function ramp(t){t=Math.max(0,Math.min(1,t));for(let i=1;i<RAMP.length;i++){if(t<=RAMP[i][0]){const a=RAMP[i-1],b=RAMP[i];return a[1].clone().lerp(b[1],(t-a[0])/(b[0]-a[0]));}}return RAMP[RAMP.length-1][1].clone();}

let surface=null,gridLines=null,surfGeo=null,gridGeo=null;
const GRID_L=72,GRID_S=240,gridUV=[];
(function makeGeometry(){
  const N=220;surfGeo=new THREE.PlaneGeometry(2*SCALE,2*SCALE,N,N);surfGeo.rotateX(-Math.PI/2);
  surfGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(surfGeo.attributes.position.count*3),3));
  surface=new THREE.Mesh(surfGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9,metalness:0.0}));scene.add(surface);
  for(let i=0;i<=GRID_L;i++){const a=i/GRID_L*2-1;for(let j=0;j<GRID_S;j++){const b0=j/GRID_S*2-1,b1=(j+1)/GRID_S*2-1;gridUV.push([a,b0],[a,b1],[b0,a],[b1,a]);}}
  const gp=new Float32Array(gridUV.length*3);gridUV.forEach((q,i)=>{gp[i*3]=wx(q[0]);gp[i*3+2]=wz(q[1]);});
  gridGeo=new THREE.BufferGeometry();gridGeo.setAttribute('position',new THREE.BufferAttribute(gp,3));gridGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(gridUV.length*3),3));
  gridLines=new THREE.LineSegments(gridGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(gridLines);
})();
// a field = heights and colours for one landscape, on the fixed geometry; two fields can be mixed
function fieldArrays(fn){
  const [mn,mx]=computeRange(fn);const tof=e=>(e-mn)/(mx-mn);
  const pos=surfGeo.attributes.position;const n=pos.count;const sy=new Float32Array(n),sc=new Float32Array(n*3);
  for(let i=0;i<n;i++){const u=pos.getX(i)/SCALE,v=pos.getZ(i)/SCALE;const e=fn(u,v);sy[i]=e*YS;const t=tof(e);const c=ramp(t).multiplyScalar(0.15+0.32*Math.pow(1-t,1.5));sc[i*3]=c.r;sc[i*3+1]=c.g;sc[i*3+2]=c.b;}
  const m=gridUV.length;const gy=new Float32Array(m),gc=new Float32Array(m*3);
  for(let i=0;i<m;i++){const q=gridUV[i];const e=fn(q[0],q[1]);gy[i]=e*YS+0.012;const t=tof(e);const c=ramp(t).multiplyScalar(0.5+0.45*(1-t));gc[i*3]=c.r;gc[i*3+1]=c.g;gc[i*3+2]=c.b;}
  return {sy,sc,gy,gc,mn,mx};
}
function applyField(A,B,k){
  const pos=surfGeo.attributes.position,col=surfGeo.attributes.color;const n=pos.count;const pa=pos.array,ca=col.array;
  for(let i=0;i<n;i++){pa[i*3+1]=B?A.sy[i]+(B.sy[i]-A.sy[i])*k:A.sy[i];for(let c=0;c<3;c++){const a=A.sc[i*3+c];ca[i*3+c]=B?a+(B.sc[i*3+c]-a)*k:a;}}
  pos.needsUpdate=true;col.needsUpdate=true;surfGeo.computeVertexNormals();
  const gp=gridGeo.attributes.position,gc=gridGeo.attributes.color;const m=gridUV.length;const ga=gp.array,gca=gc.array;
  for(let i=0;i<m;i++){ga[i*3+1]=B?A.gy[i]+(B.gy[i]-A.gy[i])*k:A.gy[i];for(let c=0;c<3;c++){const a=A.gc[i*3+c];gca[i*3+c]=B?a+(B.gc[i*3+c]-a)*k:a;}}
  gp.needsUpdate=true;gc.needsUpdate=true;
}
let FIELD=fieldArrays(f);applyField(FIELD,null,0);FMIN=FIELD.mn;FMAX=FIELD.mx;
const MORPH={active:false,t:0,from:null,to:null,land:null};

function radialTex(stops){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
const TEX_WARM=radialTex([[0,'rgba(255,246,225,1)'],[0.3,'rgba(255,200,110,0.35)'],[1,'rgba(0,0,0,0)']]);
const TEX_COOL=radialTex([[0,'rgba(238,244,255,1)'],[0.3,'rgba(160,185,240,0.35)'],[1,'rgba(0,0,0,0)']]);
const TEX_DOT=radialTex([[0,'rgba(255,255,255,1)'],[0.4,'rgba(255,255,255,0.5)'],[1,'rgba(255,255,255,0)']]);
const TEX_SHADOW=radialTex([[0,'rgba(0,0,0,0.75)'],[0.5,'rgba(0,0,0,0.35)'],[1,'rgba(0,0,0,0)']]);
// a bead with a dark rim, so a particle reads on the bright floor of a basin as well as on a dark ridge
const TEX_BEAD=radialTex([[0,'rgba(255,240,210,1)'],[0.28,'rgba(255,214,140,1)'],[0.42,'rgba(20,12,30,0.85)'],[0.6,'rgba(20,12,30,0)'],[1,'rgba(0,0,0,0)']]);
function sprite(tex,size,color,opacity,blending){const m=new THREE.SpriteMaterial({map:tex,color:color||0xffffff,transparent:true,opacity:opacity==null?1:opacity,blending:blending||THREE.AdditiveBlending,depthWrite:false});const s=new THREE.Sprite(m);s.scale.set(size,size,1);return s;}

// dust: slow motes above the surface, for depth
const dust=(function(){const n=520;const p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(Math.random()*2-1)*SCALE*1.2;p[i*3+1]=-2+Math.random()*7;p[i*3+2]=(Math.random()*2-1)*SCALE*1.2;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const m=new THREE.Points(g,new THREE.PointsMaterial({size:0.09,map:TEX_DOT,color:0xc9b8ff,transparent:true,opacity:0.32,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(m);return m;})();

// dice
const DICE=[];
for(let n=1;n<=6;n++){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.fillStyle='#f6f2ea';x.strokeStyle='#c4bdb0';x.lineWidth=4;const r=22;x.beginPath();x.moveTo(r,8);x.arcTo(120,8,120,120,r);x.arcTo(120,120,8,120,r);x.arcTo(8,120,8,8,r);x.arcTo(8,8,120,8,r);x.closePath();x.fill();x.stroke();
  const P={1:[[64,64]],2:[[36,36],[92,92]],3:[[36,36],[64,64],[92,92]],4:[[36,36],[92,36],[36,92],[92,92]],5:[[36,36],[92,36],[64,64],[36,92],[92,92]],6:[[36,32],[92,32],[36,64],[92,64],[36,96],[92,96]]}[n];
  x.fillStyle='#1a1a22';P.forEach(p=>{x.beginPath();x.arc(p[0],p[1],9,0,Math.PI*2);x.fill();});
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;DICE.push(t);}
const dice=[];
function popDice(x,y,z,accepted){
  const n=1+Math.floor(Math.random()*2);
  for(let i=0;i<n;i++){
    const m=new THREE.SpriteMaterial({map:DICE[Math.floor(Math.random()*6)],transparent:true,opacity:0,depthWrite:false,rotation:Math.random()*6.28,color:accepted?0xffffff:0x6a6a72});
    const s=new THREE.Sprite(m);s.scale.set(0.46,0.46,1);s.position.set(x+(i?0.34:-0.14),y+0.6,z+(i?0.1:-0.1));
    s.userData={t:0,vx:(Math.random()-0.5)*0.9,vy:1.7+Math.random()*0.6,vr:(Math.random()-0.5)*7,acc:accepted};scene.add(s);dice.push(s);}
}
function stepDice(dt){for(let i=dice.length-1;i>=0;i--){const s=dice[i],d=s.userData;d.t+=dt;const life=d.acc?1.15:0.7;
  s.position.x+=d.vx*dt;s.position.y+=d.vy*dt;d.vy-=3.4*dt;s.material.rotation+=d.vr*dt;
  s.material.opacity=d.t<0.1?d.t/0.1:Math.max(0,1-(d.t-0.1)/(life-0.1));
  if(d.t>life){scene.remove(s);s.material.dispose();dice.splice(i,1);}}}

/* ------------------------------------------------------------------ runners */
class Runner{
  constructor(name,stochastic,color,tex,cls){
    this.name=name;this.stochastic=stochastic;this.cls=cls;this.color=color;
    this.mesh=new THREE.Mesh(new THREE.SphereGeometry(R,32,24),new THREE.MeshStandardMaterial({color:0xfff8ee,emissive:color,emissiveIntensity:0.7,roughness:0.2,metalness:0.05}));
    this.glow=sprite(tex,1.7,color,0.9);this.mesh.add(this.glow);
    this.light=new THREE.PointLight(color,1.5,6,2);this.mesh.add(this.light);
    scene.add(this.mesh);
    this.shadow=sprite(TEX_SHADOW,0.8,0xffffff,0.55,THREE.NormalBlending);scene.add(this.shadow);
    const MAX=6000;this.tpos=new Float32Array(MAX*3);this.tgeo=new THREE.BufferGeometry();this.tgeo.setAttribute('position',new THREE.BufferAttribute(this.tpos,3));this.tgeo.setDrawRange(0,0);
    this.trail=new THREE.Line(this.tgeo,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.7}));scene.add(this.trail);
    this.beads=new THREE.Points(this.tgeo,new THREE.PointsMaterial({size:0.3,map:TEX_DOT,color,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));scene.add(this.beads);
    this.ringM=new THREE.Mesh(new THREE.RingGeometry(0.3,0.37,48),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(this.ringM);
    this.hist=[];this.reset(DROP.u,DROP.v);
  }
  reset(u,v){this.u=u;this.v=v;this.gu=u;this.gv=v;this.vu=0;this.vv=0;this.state='rolling';this.still=0;this.n=0;this.tgeo.setDrawRange(0,0);this.hop=null;this.timer=0.7+Math.random()*0.3;this.hist.length=0;this.lastRec=0;this.ringM.material.opacity=0;this.place();this.record(0,true);}
  e(){return f(this.u,this.v);}
  place(){this.mesh.position.set(wx(this.u),wy(this.u,this.v)+R,wz(this.v));this.gu=this.u;this.gv=this.v;}
  record(t,force){if(force||t-this.lastRec>0.08){this.hist.push([t,this.e()]);this.lastRec=t;if(this.hist.length>1400)this.hist.shift();}}
  addTrail(){const i=this.n;if(i*3+2>=this.tpos.length)return;this.tpos[i*3]=wx(this.u);this.tpos[i*3+1]=wy(this.u,this.v)+0.035;this.tpos[i*3+2]=wz(this.v);this.n++;this.tgeo.setDrawRange(0,this.n);this.tgeo.attributes.position.needsUpdate=true;}
  markStuck(t){this.state='stuck';this.ringM.position.set(wx(this.u),wy(this.u,this.v)+0.03,wz(this.v));this.ringM.rotation.x=-Math.PI/2;this.ringM.userData.born=t;}
  step(dt,t,T){
    if(this.hop){
      const h=this.hop;h.t+=dt/h.dur;const s=Math.min(1,h.t);const k=s<.5?2*s*s:1-Math.pow(-2*s+2,2)/2;
      const u=h.u0+(h.u1-h.u0)*k,v=h.v0+(h.v1-h.v0)*k;const y0=wy(h.u0,h.v0),y1=wy(h.u1,h.v1);
      this.mesh.position.set(wx(u),y0+(y1-y0)*k+R+h.arc*4*s*(1-s),wz(v));this.gu=u;this.gv=v;

  x.strokeStyle='rgba(255,198,90,0.22)';x.lineWidth=1;x.beginPath();for(let i=0;i<=60;i++){const tt=t0+span*i/60;const T=G.cool?Math.max(0.015,G.T0*Math.exp(-Math.max(0,tt-G.HOLD)/G.TAU)):G.T0;const py=H-6-(T/1.2)*(H*0.35);if(i===0)x.moveTo(X(tt),py);else x.lineTo(X(tt),py);}x.stroke();
  (G.view==='copies'?[[bol,'#ffc65a'],[bol2,'#ff9a5a']]:[[hop,'#a9c4ff'],[bol,'#ffc65a']]).forEach(([r,col])=>{x.strokeStyle=col;x.lineWidth=2.5;x.lineJoin='round';x.beginPath();let first=true;
    r.hist.forEach(p=>{if(p[0]<t0)return;const px=X(p[0]),py=Y(p[1]);if(first){x.moveTo(px,py);first=false;}else x.lineTo(px,py);});x.stroke();
    if(r.hist.length){const p=r.hist[r.hist.length-1];x.fillStyle=col;x.beginPath();x.arc(X(p[0]),Y(p[1]),4,0,Math.PI*2);x.fill();}});
}

/* ------------------------------------------------------------------ loop */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;const pr=renderer.getPixelRatio();const W=Math.floor(w*pr),H=Math.floor(h*pr);
  if(canvas.width!==W||canvas.height!==H){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();cam.vr=fitRadius();bloomResize(W,H);}}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;G.t+=dt;
  resize();
  if(MORPH.active){
    MORPH.t+=dt/1.8;const t=Math.min(1,MORPH.t);const k=t*t*(3-2*t);applyField(MORPH.from,MORPH.to,k);
    if(t>=1){FIELD=MORPH.to;LAND=MORPH.land;f=LAND.f;FMIN=FIELD.mn;FMAX=FIELD.mx;DROP.u=LAND.drop.u;DROP.v=LAND.drop.v;MORPH.active=false;restart();}
    G.t-=dt;
  }else{
  G.T=schedule();showT();
  if(ENS.active){ensStep(dt,G.T);}else if(G.view==='copies'){bol.step(dt,G.t,G.T);bol2.step(dt,G.t,G.T);}else{hop.step(dt,G.t,G.T);bol.step(dt,G.t,G.T);}}
  stepDice(dt);
  hop.frame(now);bol.frame(now);bol2.frame(now);
  [hop,bol,bol2].forEach(r=>{if(r.state==='stuck'){const a=G.t-(r.ringM.userData.born||0);r.ringM.material.opacity=0.6*Math.min(1,a)*(0.7+0.3*Math.sin(a*3));r.ringM.scale.setScalar(1+0.08*Math.sin(a*3));}});
  if(ENS.active){if(G.T<=0.04){G.idleDone+=dt;if(G.loop&&G.idleDone>6)restart();}}
  else if(G.view==='copies'){if(bol.state==='stuck'&&bol2.state==='stuck'){G.idleDone+=dt;if(G.loop&&G.idleDone>5)restart();}}
  else if(hop.state==='stuck'&&bol.state==='stuck'){G.idleDone+=dt;if(G.loop&&G.idleDone>5)restart();}
  else if(G.loop&&G.t>70)restart();
  // dust drifts
  const dp=dust.geometry.attributes.position;for(let i=0;i<dp.count;i++){let y=dp.getY(i)+dt*0.06;if(y>5)y=-2;dp.setY(i,y);}dp.needsUpdate=true;
  cam.idle+=dt;if(cam.idle>5&&!cam.drag){cam.vt+=dt*0.028;if(!cam.drag)cam.vr=fitRadius();}camApply();
  placeLabels();drawStrip();document.querySelector('.key').style.visibility=G.view==='ensemble'?'hidden':'visible';
  renderer.setRenderTarget(null);renderer.render(scene,camera);
  if(BLOOM.ok)renderBloom();
}
function loop(now){frame(now);requestAnimationFrame(loop);}
window.__SD={G,hop,bol,bol2,get f(){return f;},DROP,restart,schedule,BLOOM,cam,MORPH,switchLand,setView,ENS,ensStep,basinMasses,ensFractions,frame:(now)=>frame(now)};
restart();
requestAnimationFrame(loop);
})();
</script>
